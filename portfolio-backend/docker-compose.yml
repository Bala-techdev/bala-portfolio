services:
  mysql:
    image: mysql:8.4
    container_name: portfolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio_dev_password
      TZ: UTC
    ports:
      - "3307:3306"   # 3307 so it does not clash with a MySQL already installed on your PC
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: